name: animatch_app
description: 動物好きが繋がるコミュニティアプリ
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  provider: ^6.1.1

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  image_picker: ^1.0.4
  http: ^1.1.0
  firebase_crashlytics: ^4.3.10
  in_app_review: ^2.0.11


flutter:
  uses-material-design: true
  assets:
    - assets/images/

dev_dependencies:
  flutter_launcher_icons: ^0.14.4


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
