# 保存（push）するたびに、アプリを組み立てて、エラーがないか自動で調べる
name: アプリのチェック

on:
  push:
    branches-ignore: [gh-pages]
  workflow_dispatch:

# 同じブランチで続けて保存したときは、古いチェックを止めて新しい方だけ動かす
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutterのバージョン
        run: flutter --version

      - name: 部品をそろえる
        run: flutter pub get

      # 結果を「注釈」として残す（Claudeが GitHub の API から読めるようにするため）
      - name: コードの点検（エラーだけで止める）
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1
          code=$?
          cat analyze.txt
          grep -E '^ *error • ' analyze.txt | head -50 | while IFS= read -r line; do
            msg=$(echo "$line" | awk -F' • ' '{print $2}')
            loc=$(echo "$line" | awk -F' • ' '{print $3}')
            file=${loc%%:*}; rest=${loc#*:}; ln=${rest%%:*}
            echo "::error file=$file,line=$ln::$msg"
          done
          w=$(grep -cE '^ *warning • ' analyze.txt)
          i=$(grep -cE '^ *info • ' analyze.txt)
          echo "::notice title=点検の結果::warning ${w}件、info ${i}件"
          exit $code

      - name: Web版を組み立てる
        shell: bash
        run: |
          set +e
          flutter build web --release --base-href /animatchc/ > build.txt 2>&1
          code=$?
          cat build.txt
          if [ $code -ne 0 ]; then
            grep -E 'Error|error' build.txt | head -40 | while IFS= read -r line; do
              echo "::error title=組み立て::$line"
            done
          fi
          exit $code

      - name: 組み立てたWeb版を保存する
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 7

      # テスト用のWeb版を、GitHubのページ（gh-pages）に置く。
      # https://animatch-jp.github.io/animatchc/ で開ける（最後に保存した版が出る）
      # 公開は main のときだけ（ほかのブランチと同時に書いてぶつからないように）
      - name: テスト用のWeb版を公開する
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "テスト用Web版: ${{ github.ref_name }} ${{ github.sha }}"
